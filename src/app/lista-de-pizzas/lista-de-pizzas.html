<div class="col-sm-12 col-md-6 w-md-50 col-lg-3 w-lg-25 card">
    <h1 class="card-title">{{caracteristicas().nombre}}</h1>
    <img src="{{caracteristicas().imagen}}" class="card-img">
    <h2 class="card-text">Precio: {{caracteristicas().precio}}€</h2>
    <p>Lista de ingredientes:</p>
    <ul class="list-group">
        @for (ingrediente of caracteristicas().listaDeIngredientes; track $index) {
            <li class="list-group-item">{{ingrediente}}</li>
        }
    </ul>
</div>
