<div class="container row">
    @for (CaracteristicasDePizza of pizzasFiltradas(); track $index) {
        <app-lista-de-pizzas class="col-sm-12 col-md-6 col-lg-3 card" [caracteristicas]="CaracteristicasDePizza" (anadirPizza)="anadirAlPedido($event)"></app-lista-de-pizzas>    
        <!--TOLEARN el anadirPizza es: cuando app-lista-de-pizzas emita un evento llamado anadirPizza, usar anadirAlPedido() de pizza.html-->
    }
</div>
